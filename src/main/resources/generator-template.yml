# ============================================================
#  EasyFK Generator 配置文件
#  使用方式：efg (在 generator.yml 所在目录执行)
# ============================================================

easyfk:
  config:
    generator:
      # ==================== 项目配置 ====================
      project:
        # [必填] 项目输出目录
        project-dir: D:\workspace\projects
        # [必填] Maven groupId
        group-id: com.example
        # [必填] 项目名称
        project-name: my-app
        # [必填] 项目包根路径
        base-package: com.example.myapp

        # 项目类型: single(单体) / microservice(微服务) / smart(多栈微服务) / micro_prd(微服务产品层)
        project-type: single
        # 构建工具: maven / gradle
        build-type: maven
        # ORM 框架: NONE / MYBATIS / MYBATIS_FLEX / HIBERNATE
        orm-type: MYBATIS
        # PRD 层策略: none(不生成) / single(单一) / separation(分离: client + bms)
        prd-type: single
        # 日志框架: LOGBACK / LOG4J2
        log-type: LOGBACK
        # 框架版本
        framework-version: 3.2.12
        # 项目版本
        project-version: 1.0.0-SNAPSHOT
        # [项目类型为 single / micro_prd，或 prd-type 为 single 时必填] 应用类型: BMS(后台管理端) / CLIENT(面向C端)
        app-type: BMS
        # 是否引入 auth 权限模块 (true/false)
        include-auth: false

      # ==================== 代码配置 ====================
      code:
        # [必填] 模块名称
        module-name: myapp
        # 作者信息
        author: eb-jack
        # 数据库类型: MYSQL / POSTGRE_SQL / ORACLE / ORACLE_12C / MARIADB / SQL_SERVER / ...
        db-type: MYSQL
        # [必填] 数据库短连接 (host:port/database)
        db-short-url: localhost:3306/my_database
        # 数据库用户名
        db-user: root
        # 数据库密码
        db-pwd: your_password
        # ---------- 表配置 ----------
        # 表前缀 (生成类名时自动去除)
        # table-prefix: base_
        # 从数据库读取的表名 (逗号分隔，会自动解析表结构)，为空则不从数据库读取表结构
        db-tables: product,order

        # ---------- 手动定义 Model (可选) ----------
        # 除 db-tables 自动解析外，也可手动定义，两者可以共存
        model-list:
          - model-name: Product
            model-desc: 商品信息
            # id-type: String
            # only-repository: false
            # create-controller: true
          - model-name: Order
            model-desc: 订单信息
