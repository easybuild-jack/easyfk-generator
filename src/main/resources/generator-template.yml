# ============================================================
#  EasyFK Generator 配置文件
#  使用方式：efg (在 generator.yml 所在目录执行)
# ============================================================

easyfk:
  config:
    generator:
      # ==================== 项目配置 ====================
      project:
        # [必填] 项目输出目录
        project-dir: D:\workspace\projects
        # [必填] Maven groupId
        group-id: com.example
        # [必填] 项目名称
        project-name: my-app
        # [必填] 项目包根路径
        base-package: com.example.myapp

        # 项目类型: single(单体) / microservice(微服务) / smart(多栈微服务)
        project-type: single
        # 构建工具: maven / gradle
        build-type: maven
        # ORM 框架: MYBATIS / MYBATIS_FLEX / HIBERNATE
        orm-type: MYBATIS
        # PRD 层策略: none(不生成) / single(单一) / separation(分离: client + bms)
        prd-type: single
        # 日志框架: LOGBACK / LOG4J2
        log-type: LOGBACK
        # 框架版本
        framework-version: 3.2.12
        # 项目版本
        project-version: 1.0.0-SNAPSHOT
        # [必填] 应用类型: BMS(后台管理端) / CLIENT(面向C端)
        app-type:
        # 业务模块列表 (可选)
        # modules:
        #   - name: auth
        #     prd-split: false    # auth 不区分 bms/client，统一使用 auth-prd
        #   - name: trading
        #     has-orm: false      # trading 不需要持久化
        #   - name: payment       # 默认: has-prd=true, prd-split=true, has-server=true, has-orm=true

      # ==================== 代码配置 ====================
      code:
        # [必填] 模块名称
        module-name: myapp
        # 作者信息
        author: eb-jack
        # [必填] 数据库短连接 (host:port/database)
        db-short-url: localhost:3306/my_database
        # 数据库用户名
        db-user: root
        # 数据库密码
        db-pwd: your_password
        # ---------- 表配置 ----------
        # 表前缀 (生成类名时自动去除)
        # table-prefix: base_
        # ORM 类型: MYBATIS / MYBATIS_FLEX / HIBERNATE
        orm-type: MYBATIS
        # 从数据库读取的表名 (逗号分隔，会自动解析表结构)
        from-db-tables: product,order

        # ---------- 手动定义 Model (可选) ----------
        # 除 from-db-tables 自动解析外，也可手动定义
        # model-list:
        #   - model-name: Product
        #     model-desc: 商品信息
        #     # id-type: String
        #     # only-repository: false
        #     # create-controller: true
        #   - model-name: Order
        #     model-desc: 订单信息
