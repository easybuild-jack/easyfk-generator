//指定项目版本号和group
version = '3.2.12'
group = 'com.mcst'
description = '易架构代码生成器'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation platform(libs.easyfkDependencies)
    compileOnly libs.lombok
    testCompileOnly libs.lombok
    annotationProcessor(libs.lombok, libs.processor)
    testAnnotationProcessor(libs.lombok, libs.processor)
    api('com.mcst:easyfk-core')
    api('com.mysql:mysql-connector-j')
    api('org.postgresql:postgresql')
    implementation('com.mcst:log-logback')
    api('org.freemarker:freemarker:2.3.31')
    implementation('info.picocli:picocli:4.7.6')
    implementation('org.yaml:snakeyaml:2.2')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

apply plugin: 'application'

application {
    mainClass = 'com.mcst.easyfk.generator.cli.GeneratorCli'
}

test {
    useJUnitPlatform()
    // 构建时跳过单元测试（如需执行测试，删除此行即可）
    enabled = false
}

tasks.register('fatJar', Jar) {
    archiveClassifier.set('cli')
    manifest {
        attributes 'Main-Class': 'com.mcst.easyfk.generator.cli.GeneratorCli'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


